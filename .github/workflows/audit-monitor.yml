name: Audit & Bounty Monitor

on:
  schedule:
    # Near-real-time new-contest/new-protocol check. The script itself
    # decides every DIGEST_INTERVAL_HOURS to also send the consolidated
    # status update, so one schedule covers both jobs.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-monitor.yml"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: audit-monitor-repo-writes
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DIGEST_INTERVAL_HOURS: "4"
        run: python scripts/scan.py 2>&1 | tee last-run.log

      - name: Commit updated state
        run: |
          git config user.name "audit-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json last-run.log
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -m "chore: update monitor state"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected, retrying with rebase ($i/5)"
            git pull --rebase origin main
            sleep 3
          done
          exit 1
