name: Diagnose scrape targets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose.yml"
      - "scripts/diagnose.py"

permissions:
  contents: write

concurrency:
  group: audit-monitor-repo-writes
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Run diagnostic
        run: python scripts/diagnose.py 2>&1 | tee diagnose.log
      - name: Commit results
        run: |
          git config user.name "audit-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add diagnose-output.json diagnose.log
          if git diff --cached --quiet; then
            echo "No diagnostic changes."
            exit 0
          fi
          git commit -m "chore: diagnostic scrape output"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected, retrying with rebase ($i/5)"
            git pull --rebase origin main
            sleep 3
          done
          exit 1
